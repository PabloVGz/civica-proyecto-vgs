name: 'civica_proyecto_vgs'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  hit_sales_threshold: 1.0

models:
  civica_proyecto_vgs:
    +transient: false

    staging:
      +database: silver_db
      +materialized: view
      +tags: ['staging']
      +meta:
        owner: "Equipo de Data Engineering"
      raw_videojuegos:
        +schema: raw_videojuegos

    silver:
      +database: silver_db
      +materialized: table
      +tags: ['silver']
      +meta:
        owner: "Equipo de Data Engineering"
      videojuegos:
        +schema: silver_videojuegos

    gold:
      +database: gold_db
      +tags: ['gold']
      intermediate:
        +materialized: view
        +schema: intermediate
        +tags: ['intermediate']
        +meta:
          owner: "Equipo de Data Engineering"
      core:
        +materialized: table
        +schema: core
        +tags: ['core']
        +meta:
          owner: "Equipo de Data Analytics"

seeds:
  civica_proyecto_vgs:
    +database: silver_db
    +schema: seeds
    seed_plataformas:
      +column_types:
        platform_code: varchar(20)
        platform_name: varchar(100)
        manufacturer: varchar(50)
        platform_type: varchar(50)